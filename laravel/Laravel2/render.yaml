services:
  - type: web
    name: Novelle
    runtime: docker
    region: singapore
    plan: free
    branch: master
    rootDir: laravel/Laravel2
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://novelle-979k.onrender.com
      - key: ASSET_URL
        value: https://novelle-979k.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: novelle-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

databases:
  - name: novelle-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: novelle_db
    user: novelle_db_user
